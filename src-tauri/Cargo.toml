[package]
name = "caption-salience"
version = "0.1.0"
description = "A local caption presentation control surface"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "caption_salience_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
